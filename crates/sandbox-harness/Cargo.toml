[package]
name          = "atomr-agents-sandbox-harness"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
description   = "Orchestrator for the atomr-agents microVM sandbox: owns a pluggable SandboxBackend, a sandbox registry, a bin-packing scheduler and snapshot pool, broadcasts SandboxEvents, and is itself a Callable."

keywords      = ["agents", "sandbox", "microvm", "harness"]
categories    = ["asynchronous"]
readme        = "README.md"

[dependencies]
atomr-agents-core          = { workspace = true }
atomr-agents-callable      = { workspace = true }
atomr-agents-observability = { workspace = true }
atomr-agents-sandbox-core  = { workspace = true }

async-trait  = { workspace = true }
tokio        = { workspace = true, features = ["sync"] }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
parking_lot  = { workspace = true }
dashmap      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
