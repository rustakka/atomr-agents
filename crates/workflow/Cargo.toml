[package]
name          = "atomr-agents-workflow"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
description   = "Workflow actor: DAG of Steps over event-sourced state."

keywords      = ["agents", "workflow", "dag", "langgraph", "atomr"]
categories    = ["asynchronous", "concurrency"]
readme        = "../../README.md"

[dependencies]
atomr-agents-core     = { workspace = true }
atomr-agents-callable = { workspace = true }
atomr-agents-state    = { workspace = true }
atomr-agents-tool     = { workspace = true }
atomr-core            = { workspace = true }
atomr-persistence     = { workspace = true }
atomr-streams         = { workspace = true }
async-trait           = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
thiserror             = { workspace = true }
tokio                 = { workspace = true }
parking_lot           = { workspace = true }
futures               = { workspace = true }
uuid                  = { workspace = true }
chrono                = { workspace = true }

# Durable SQL backends for the interrupt registry (FR-4) and the
# transactional outbox (FR-5). Mirrors crates/state: sqlx over the `any`
# driver targets SQLite + Postgres from one code path, with `SqlConfig`
# reused from atomr-persistence-sql for URL/dialect resolution.
sqlx                  = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "macros", "chrono"], optional = true }
atomr-persistence-sql = { version = "0.9.2", optional = true }

[features]
default  = []
# `sql` is the shared implementation marker; the dialect features turn on
# the matching sqlx driver. Mirrors crates/state's feature layout.
sql      = ["dep:sqlx", "dep:atomr-persistence-sql"]
sqlite   = ["sql", "sqlx/sqlite", "atomr-persistence-sql/sqlite"]
postgres = ["sql", "sqlx/postgres", "atomr-persistence-sql/postgres"]
