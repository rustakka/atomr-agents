[package]
name          = "atomr-agents-sandbox-harness-web"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
description   = "Axum REST + SSE companion for the atomr-agents sandbox harness: create/exec/fork/snapshot/destroy endpoints and a SandboxEvent /events stream."

keywords      = ["agents", "sandbox", "web", "atomr"]
categories    = ["web-programming::http-server"]
readme        = "README.md"

[[bin]]
name = "atomr-agents-sandbox-harness-web"
path = "src/bin/server.rs"

[dependencies]
atomr-agents-sandbox-core    = { workspace = true }
atomr-agents-sandbox-harness = { workspace = true }

async-trait  = { workspace = true }
tokio        = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }

axum         = { workspace = true }
tower        = { workspace = true }
tower-http   = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util = "0.1"
