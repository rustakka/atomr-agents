[package]
name          = "atomr-agents-sandbox-tool"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
description   = "The `execute_in_sandbox` Tool: exposes the atomr-agents microVM sandbox harness to agents, with profile resolution, Rust-floor budget scaling, and EventBus telemetry."

keywords      = ["agents", "tool", "sandbox", "microvm"]
categories    = ["asynchronous"]
readme        = "README.md"

[dependencies]
atomr-agents-core          = { workspace = true }
atomr-agents-tool          = { workspace = true }
atomr-agents-sandbox-core  = { workspace = true }
atomr-agents-sandbox-harness = { workspace = true }

async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
