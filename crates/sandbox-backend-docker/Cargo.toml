[package]
name          = "atomr-agents-sandbox-backend-docker"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
description   = "Docker (bollard) backend for the atomr-agents microVM sandbox — the cross-platform \"Insecure Dev Mode\" fallback. One container per sandbox; exec, file I/O, commit-based snapshot/fork."

keywords      = ["agents", "sandbox", "docker", "atomr"]
categories    = ["asynchronous"]
readme        = "README.md"

[dependencies]
atomr-agents-sandbox-core = { workspace = true }

async-trait  = { workspace = true }
tokio        = { workspace = true, features = ["full"] }
futures-util = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
tracing      = { workspace = true }
bytes        = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }

bollard      = "0.17"
tar          = "0.4"
base64       = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
