[package]
name          = "atomr-agents-sandbox-core"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
homepage      = { workspace = true }
authors       = { workspace = true }
description   = "Backend-agnostic microVM sandbox traits, profile/budget/request types, lifecycle events, and a deterministic in-memory mock backend for the atomr-agents sandbox subsystem."

keywords      = ["agents", "sandbox", "microvm", "atomr"]
categories    = ["asynchronous"]
readme        = "README.md"

[dependencies]
async-trait  = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
parking_lot  = { workspace = true }
tokio        = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
